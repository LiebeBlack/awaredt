name: Android Release

# Release ESTABLE: se publica al etiquetar (v1.x). Firma con el mismo keystore
# que la CI continua, para que el APK estable se instale sobre cualquier
# compilacion anterior sin desinstalar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ci/keystore
          key: agent-keystore-v1

      - name: Create signing keystore if missing
        run: |
          mkdir -p ci/keystore
          if [ ! -f ci/keystore/agent.keystore ]; then
            keytool -genkeypair -v \
              -keystore ci/keystore/agent.keystore \
              -alias locator-agent \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=Locator Agent, OU=Familia, O=Privado, L=Madrid, C=ES"
            echo "Keystore nuevo generado"
          else
            echo "Keystore reutilizado de cache"
          fi
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'agent-local-signing-2026' }}

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/ci/keystore/agent.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'agent-local-signing-2026' }}
          SIGNING_KEY_ALIAS: locator-agent
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}

      - name: Rename APK with tag
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/locator-agent-${{ github.ref_name }}.apk"
          ls -la dist/

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
